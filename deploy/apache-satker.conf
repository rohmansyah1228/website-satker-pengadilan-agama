# Contoh VirtualHost Apache — sesuaikan domain & path. Aktifkan mod_rewrite, mod_ssl, mod_headers.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName www.pa-contoh.go.id
    Redirect permanent / https://www.pa-contoh.go.id/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.pa-contoh.go.id
    DocumentRoot /var/www/website-satker/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/pa-contoh/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/pa-contoh/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header unset X-Powered-By

    <Directory /var/www/website-satker/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/satker_error.log
    CustomLog ${APACHE_LOG_DIR}/satker_access.log combined
</VirtualHost>
