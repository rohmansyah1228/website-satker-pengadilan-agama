# Contoh konfigurasi Nginx — sesuaikan nama domain & path.
# Memenuhi SK 2722/2026 Bab II: HTTPS paksa, TLS >= 1.2, sembunyikan versi, tanpa directory listing.

server {
    listen 80;
    server_name www.pa-contoh.go.id pa-contoh.go.id;
    return 301 https://www.pa-contoh.go.id$request_uri;          # F.1 force redirect ke HTTPS
}

server {
    listen 443 ssl http2;
    server_name www.pa-contoh.go.id;
    root /var/www/website-satker/public;                          # HANYA folder public yang diekspos
    index index.php;

    ssl_certificate     /etc/ssl/pa-contoh/fullchain.pem;
    ssl_certificate_key /etc/ssl/pa-contoh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;                                # F.2 nonaktifkan SSLv3/TLS1.0/1.1
    ssl_prefer_server_ciphers on;

    server_tokens off;                                            # A.3 sembunyikan versi
    autoindex off;                                                # A.3 tanpa directory listing
    client_max_body_size 25m;
    keepalive_requests 10000;                                     # koneksi browser dipakai ulang lebih lama
    # PENTING: naikkan juga worker_connections di /etc/nginx/nginx.conf menjadi 4096
    # (bawaan Ubuntu 768 terlalu kecil saat ratusan pengunjung serentak — lihat README)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/satker_access.log;                  # G.2 log forensik
    error_log  /var/log/nginx/satker_error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # favicon.ico diarahkan ke logo satker (Pengaturan → Logo)
    location = /favicon.ico { try_files $uri /index.php$is_args$args; log_not_found off; access_log off; }

    location ~* \.(css|js|woff2?|svg|webp|png|jpe?g|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Unggahan: jangan pernah eksekusi PHP
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
